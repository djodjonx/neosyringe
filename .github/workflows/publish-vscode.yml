name: Publish VSCode Extension

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Extension version (e.g. 0.1.0)'
        required: true
        default: '0.1.0'

jobs:
  publish-vscode:
    name: Build and publish VSCode extension
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-pnpm

      - name: Set version in package.json
        run: |
          cd packages/vscode-extension
          npm pkg set version="${{ github.event.inputs.version }}"

      - name: Build extension bundle
        run: node packages/vscode-extension/esbuild.mjs

      - name: Package VSIX
        run: npx @vscode/vsce package --no-dependencies
        working-directory: packages/vscode-extension

      - name: Create GitHub Release and upload VSIX
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VSIX=$(ls packages/vscode-extension/*.vsix | head -1)
          TAG="neosyringe-vscode-v${{ github.event.inputs.version }}"
          gh release create "$TAG" "$VSIX" \
            --title "VSCode Extension v${{ github.event.inputs.version }}" \
            --notes "NeoSyringe VSCode extension v${{ github.event.inputs.version }}

## Installation
\`\`\`bash
gh release download $TAG --pattern '*.vsix' --repo djodjonx/neosyringe
code --install-extension neosyringe-vscode-${{ github.event.inputs.version }}.vsix
\`\`\`

Or search **NeoSyringe** in the VSCode Extensions panel (via Open VSX)."
          echo "✅ GitHub Release $TAG created"

      - name: Publish to Open VSX Registry
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
        run: |
          VSIX=$(ls packages/vscode-extension/*.vsix | head -1)
          npx ovsx publish "$VSIX" -p "$OVSX_TOKEN"
          echo "✅ Published to Open VSX"
