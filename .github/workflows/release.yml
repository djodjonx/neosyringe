name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      vscode_released: ${{ steps.release.outputs['packages/vscode-extension--release_created'] }}
      vscode_version: ${{ steps.release.outputs['packages/vscode-extension--version'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          include-component-in-tag: 'true'

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [release-please]
    if: needs.release-please.outputs.releases_created == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: ./.github/actions/setup-node-pnpm
        with:
          registry-url: 'https://registry.npmjs.org'

      - name: Build
        run: pnpm build

      - name: Sync README to neosyringe package
        run: pnpm sync-readme

      - name: Publish to npm
        run: pnpm -r publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  update-examples:
    name: Update example versions
    runs-on: ubuntu-latest
    needs: [release-please, publish]
    if: needs.release-please.outputs.releases_created == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - uses: ./.github/actions/setup-node-pnpm

      - name: Bump example versions
        run: node scripts/update-examples.mjs

      - name: Commit updated examples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add examples/nuxt/package.json examples/nestjs/package.json
          git diff --staged --quiet || git commit -m "chore(examples): bump @djodjonx package versions [skip ci]"
          git push

  publish-vscode:
    name: Publish VSCode extension
    runs-on: ubuntu-latest
    needs: [release-please]
    if: needs.release-please.outputs.vscode_released == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: ./.github/actions/setup-node-pnpm

      - name: Build workspace dependencies
        run: pnpm --filter @djodjonx/neosyringe-core --filter @djodjonx/neosyringe-ui build

      - name: Build VSCode extension bundle
        run: node esbuild.mjs
        working-directory: packages/vscode-extension

      - name: Package VSIX
        run: npx @vscode/vsce package --no-dependencies
        working-directory: packages/vscode-extension

      - name: Upload VSIX to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: packages/vscode-extension
        run: |
          VSIX=$(ls *.vsix | head -1)
          TAG="neosyringe-vscode-v${{ needs.release-please.outputs.vscode_version }}"
          gh release upload "$TAG" "$VSIX" --clobber
          echo "Uploaded $VSIX to $TAG"

      - name: Publish to Open VSX Registry
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
        working-directory: packages/vscode-extension
        run: |
          VSIX=$(ls *.vsix | head -1)
          npx ovsx publish "$VSIX" -p "$OVSX_TOKEN"

      - name: Publish to VS Code Marketplace
        continue-on-error: true
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
        working-directory: packages/vscode-extension
        run: |
          VSIX=$(ls *.vsix | head -1)
          npx @vscode/vsce publish --packagePath "$VSIX" -p "$VSCE_TOKEN"
